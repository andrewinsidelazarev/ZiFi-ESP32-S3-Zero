[platformio]
default_envs = esp32s3_zero

[env:esp32s3_zero]
; Waveshare рекомендует esp32-s3-devkitm-1 для PlatformIO. Параметры памяти
; ниже переопределяют 8-МБ профиль DevKitM под ESP32-S3FH4R2: 4 МБ Flash и
; 2 МБ встроенной QSPI PSRAM.
platform = espressif32@7.0.0
board = esp32-s3-devkitm-1
framework = arduino
custom_zifi_version = s3-native-0.6.83

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_files = data/cert/x509_crt_bundle.bin

build_unflags =
    -std=gnu++11
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DBOARD_HAS_PSRAM
    -DZIFI_DIAGNOSTIC_LOG=0
    -DZIFI_BUILD_VERSION=\"${this.custom_zifi_version}\"

extra_scripts = post:tools/package_firmware.py
upload_protocol = esptool
upload_speed = 460800

[env:esp32s3_zero_log]
extends = env:esp32s3_zero
custom_zifi_version = s3-native-0.6.83-log
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DBOARD_HAS_PSRAM
    -DZIFI_DIAGNOSTIC_LOG=1
    -DZIFI_BUILD_VERSION=\"${this.custom_zifi_version}\"
